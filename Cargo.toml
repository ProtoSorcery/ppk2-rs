[package]
name = "ppk2"
version = "0.1.4"
edition = "2021"
authors = ["Henk Oordt <hd@oordt.dev>"]
description = "A driver for Nordic's Power Profiler Kit 2"
readme = "README.md"
repository = "https://github.com/hdoordt/ppk2-rs"
license = "MIT"
keywords = ["PPK2", "Power", "Profiler", "Nordic", "Serial"]
categories = ["embedded", "development-tools::profiling"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num_enum = "0.7.3"
serialport = "4.7.2"
thiserror = "2.0.12"
tracing = "0.1.41"

# Windows-only: `SetCommTimeouts` / `COMMTIMEOUTS`, used to program the serial
# driver for read coalescing on the measurement port (see `win_read_coalescing`
# in src/lib.rs). This is the SAME version serialport 4.9 already depends on for
# `cfg(windows)`, with a subset of its features, so nothing new enters the
# dependency tree — only an edge to a crate that was already there.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
] }

[dev-dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
ctrlc = "3.4.7"
tracing-subscriber = "0.3.19"
clap = { version = "4.5.40", features = ["derive", "env"] }

[badges]
maintenance = { status = "passively-maintained" }
